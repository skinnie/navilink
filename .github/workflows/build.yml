name: build

# Every push and pull request: run the tests and build the Android app.
# A tag like v0.1.0 also attaches the APK to a GitHub Release (v0.x = pre-release).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      # gpsbabel lets the tests compare our .gpi files with its own.
      - run: sudo apt-get update && sudo apt-get install -y gpsbabel
      - run: ./gradlew :app:desktopTest
      # Debug-signed, so it installs straight away ("install unknown apps" must be allowed).
      - run: ./gradlew :app:assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk NaviLink-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: NaviLink-Android, path: NaviLink-android.apk }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: NaviLink-android.apk
          prerelease: ${{ startsWith(github.ref, 'refs/tags/v0.') }}
